global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "fastapi"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: "railmadad-api"

  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]
        labels:
          service: "railmadad-redis"

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres:5432"]
        labels:
          service: "railmadad-db"

  - job_name: "nginx"
    static_configs:
      - targets: ["nginx:80"]
        labels:
          service: "railmadad-proxy"
