[tool.poetry]
name = "railmadad-backend"
version = "0.1.0"
description = "RailMadad AI Platform — FastAPI Backend"
authors = ["RailMadad Team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"

# ── Web Framework ────────────────────────────
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
python-multipart = "^0.0.9"

# ── Database ─────────────────────────────────
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
asyncpg = "^0.29.0"
alembic = "^1.13.0"
pgvector = "^0.3.0"

# ── Auth ─────────────────────────────────────
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
bcrypt = "^4.1.0"

# ── Validation & Serialization ──────────────
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
email-validator = "^2.2.0"

# ── Redis & Celery ──────────────────────────
redis = "^5.0.0"
celery = {extras = ["redis"], version = "^5.4.0"}

# ── AI / ML ─────────────────────────────────
langchain = "^0.3.0"
langchain-community = "^0.3.0"
langgraph = "^0.2.0"
sentence-transformers = "^3.0.0"
openai-whisper = "^20231117"
transformers = "^4.44.0"
torch = "^2.4.0"

# ── HTTP Client ─────────────────────────────
httpx = "^0.27.0"

# ── Notifications ───────────────────────────
twilio = "^9.0.0"
sendgrid = "^6.11.0"

# ── WebSockets ──────────────────────────────
websockets = "^12.0"

# ── Monitoring ──────────────────────────────
prometheus-fastapi-instrumentator = "^7.0.0"

# ── Utilities ───────────────────────────────
python-dotenv = "^1.0.0"
orjson = "^3.10.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
httpx = "^0.27.0"
ruff = "^0.6.0"
mypy = "^1.11.0"
factory-boy = "^3.3.0"
faker = "^28.0.0"

[tool.ruff]
target-version = "py311"
line-length = 120
select = ["E", "W", "F", "I", "N", "UP", "S", "B", "A", "COM", "C4", "DTZ", "ISC", "ICN", "PIE", "PT", "RSE", "RET", "SLF", "SIM", "TID", "TCH", "ARG", "ERA", "PGH", "PL", "TRY", "FLY", "PERF", "RUF"]
ignore = ["S101", "TRY003", "COM812", "ISC001"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=app --cov-report=term-missing"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
