name: CI/CD Pipeline & Notification

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Run Pytest Suite
        run: |
          cd backend
          pip install poetry
          poetry install
          poetry run pytest
